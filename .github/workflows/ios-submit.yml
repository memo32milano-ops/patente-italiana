name: iOS submit for review (no rebuild)
on:
  workflow_dispatch:
    inputs:
      build: { description: 'Build number already uploaded (e.g. 2611121756)', required: true }
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install pyjwt cryptography requests >/dev/null
      - name: App Store page + review submission
        env:
          ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}'
          ASC_ISSUER_ID: f006bddd-6898-407b-9bea-5ec64d732a1e
          ASC_KEY_ID: 85Z32QPP5D
        run: if [ "${{ inputs.build }}" = status ]; then python3 tools/asc_status.py; else python3 tools/asc_store.py --build=${{ inputs.build }}; fi
