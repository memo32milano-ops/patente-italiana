name: Play audit (read-only)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-api-python-client google-auth
      - env: { PLAY_JSON: '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' }
        run: python3 tools/play_audit.py
      - name: download it-IT / ar / en-US images
        run: |
          python3 - <<'P'
          import json, urllib.request, os
          d = json.load(open('audit/play.json'))
          for lang in ('it-IT', 'ar', 'en-US'):
              for t, imgs in d['images'].get(lang, {}).items():
                  for i, im in enumerate(imgs):
                      urllib.request.urlretrieve(im['url'] + '=w1080', f'audit/{lang}_{t}_{i}.png')
          P
      - name: publish to branch audit-data
        run: |
          cd audit && git init -q && git checkout -q -b audit-data && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm audit
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" audit-data
