name: Test APK to branch
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Build Android run id', required: true }
permissions: { contents: write, actions: read }
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: PatenteItaliana-apk, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}', path: apk }
      - run: |
          mkdir out && cp apk/*.apk out/PatenteItaliana-test.apk && ls -la out
          cd out && git init -q -b test-apk && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "test apk ${{ inputs.run_id }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-apk
